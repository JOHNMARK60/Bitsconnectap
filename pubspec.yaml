name: bits_mobile_app
description: "BITS Student, Alumni, and Scanner mobile application."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+5

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.2+1
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0-beta.4
  google_fonts: ^6.3.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  mobile_scanner: ^7.1.3
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  geolocator: ^11.0.0
  flutter_local_notifications: ^22.0.1
  google_mlkit_face_detection: ^0.13.1
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/bits_logo.jpg
    - assets/audio/scan.mp3
